<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </radialGradient>
    <linearGradient id="saddleCover" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d3137"/>
      <stop offset="40%" stop-color="#181a1d"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </linearGradient>
    <linearGradient id="carbonRails" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a5058"/>
      <stop offset="50%" stop-color="#1e2126"/>
      <stop offset="100%" stop-color="#101215"/>
    </linearGradient>
    <pattern id="honeycomb3D" width="12" height="20.78" patternUnits="userSpaceOnUse">
      <path d="M 6 0 L 12 3.46 L 12 10.39 L 6 13.86 L 0 10.39 L 0 3.46 Z" fill="none" stroke="#374151" stroke-width="0.8" opacity="0.35"/>
      <path d="M 6 20.78 L 12 17.32 L 12 10.39 L 6 13.86 L 0 10.39 L 0 17.32 Z" fill="none" stroke="#374151" stroke-width="0.8" opacity="0.35"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGlow)"/>

  <!-- Pedestal Shadow -->
  <ellipse cx="400" cy="490" rx="260" ry="22" fill="#000000" opacity="0.12" filter="blur(12px)"/>

  <g filter="url(#shadow)">
    <!-- Carbon Rails 7x9mm Oval (Underneath) -->
    <path d="M260 380 Q400 395 540 380 Q560 380 570 360 L570 340 L550 340 Q400 355 250 340 L230 340 L230 360 Q240 380 260 380 Z" fill="url(#carbonRails)"/>
    <path d="M260 395 Q400 410 540 395" stroke="#111" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Rail Measurement Ticks -->
    <g stroke="#ffffff" stroke-width="1.5" opacity="0.6">
      <line x1="370" y1="388" x2="370" y2="398"/>
      <line x1="385" y1="388" x2="385" y2="398"/>
      <line x1="400" y1="386" x2="400" y2="400"/>
      <line x1="415" y1="388" x2="415" y2="398"/>
      <line x1="430" y1="388" x2="430" y2="398"/>
    </g>

    <!-- Main Saddle Ergonomic Shell (Side-Isometric Studio Profile) -->
    <path d="M190 280 C230 260, 310 240, 400 240 C520 240, 610 270, 630 310 C620 335, 590 345, 550 340 C480 330, 420 325, 400 325 C350 325, 270 335, 210 340 C175 342, 160 325, 165 305 C170 290, 178 285, 190 280 Z" fill="url(#saddleCover)"/>

    <!-- 3D Printed Honeycomb Padding Zone (Adaptive Cushioning Matrix) -->
    <path d="M230 275 C290 255, 360 250, 420 250 C500 250, 570 275, 590 305 C570 320, 520 325, 440 320 C380 315, 300 315, 240 322 C215 320, 210 300, 220 288 Z" fill="url(#honeycomb3D)"/>

    <!-- Ergonomic Cutout / Pressure Relief Channel -->
    <path d="M330 285 Q400 280 470 285 Q480 295 470 305 Q400 310 330 305 Q320 295 330 285 Z" fill="#0b0d0f" stroke="#1a1d21" stroke-width="2"/>

    <!-- High-Grip Micro-texture Side Wings -->
    <path d="M540 285 C580 300, 610 320, 605 335 C585 340, 550 335, 530 320 Z" fill="#14171a" opacity="0.6"/>

    <!-- Minimalist Technical Branding -->
    <text x="400" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" letter-spacing="3" fill="#9ca3af" text-anchor="middle">
      CARBON ADAPTIVE 3D · 143MM
    </text>
  </g>
</svg>
