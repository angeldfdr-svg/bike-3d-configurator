<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </radialGradient>
    <linearGradient id="metalChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5e7eb"/>
      <stop offset="35%" stop-color="#9ca3af"/>
      <stop offset="70%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="anodizedBlack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d333b"/>
      <stop offset="50%" stop-color="#1c2128"/>
      <stop offset="100%" stop-color="#0c0e12"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGlow)"/>

  <!-- Pedestal Shadow -->
  <ellipse cx="400" cy="510" rx="270" ry="22" fill="#000000" opacity="0.12" filter="blur(12px)"/>

  <g filter="url(#shadow)">
    <!-- 12-Speed Cassette (Stacked Steel & Titanium Cogs) -->
    <g transform="translate(180, 240)">
      <circle cx="90" cy="90" r="90" fill="url(#metalChrome)" stroke="#6b7280" stroke-width="1.5"/>
      <circle cx="90" cy="90" r="78" fill="url(#metalChrome)" stroke="#4b5563" stroke-width="1.5"/>
      <circle cx="90" cy="90" r="66" fill="url(#metalChrome)" stroke="#374151" stroke-width="1.5"/>
      <circle cx="90" cy="90" r="54" fill="url(#metalChrome)" stroke="#1f2937" stroke-width="1.5"/>
      <circle cx="90" cy="90" r="42" fill="url(#metalChrome)" stroke="#111827" stroke-width="1.5"/>
      <circle cx="90" cy="90" r="30" fill="url(#metalChrome)" stroke="#374151" stroke-width="1.5"/>
      <circle cx="90" cy="90" r="18" fill="#111827"/>
      <!-- Lockring -->
      <circle cx="90" cy="90" r="12" fill="#3b82f6" opacity="0.8"/>
      <circle cx="90" cy="90" r="6" fill="#000"/>
    </g>

    <!-- Electronic Rear Derailleur Body (Shimano Di2 / SRAM AXS Style) -->
    <g transform="translate(340, 230)">
      <!-- Upper B-Knuckle and Hanger Bolt -->
      <circle cx="70" cy="50" r="18" fill="url(#anodizedBlack)"/>
      <circle cx="70" cy="50" r="8" fill="url(#metalChrome)"/>

      <!-- Parallelogram Linkage & Servo Motor Housing -->
      <path d="M70 50 L140 70 L130 130 L60 110 Z" fill="url(#anodizedBlack)"/>
      <!-- LED Indicator / Bluetooth Pairing Button -->
      <circle cx="105" cy="85" r="4" fill="#10b981"/>

      <!-- P-Knuckle and Tension Spring Assembly -->
      <circle cx="110" cy="140" r="16" fill="url(#anodizedBlack)"/>

      <!-- Carbon Pulley Cage (Inner & Outer Plates) -->
      <path d="M110 140 L150 240 L125 240 L85 140 Z" fill="#111316"/>

      <!-- Upper Guide Pulley (11T Bearing Wheel) -->
      <circle cx="110" cy="140" r="14" fill="#1f242d" stroke="#6b7280" stroke-width="2"/>
      <circle cx="110" cy="140" r="4" fill="url(#metalChrome)"/>

      <!-- Lower Tension Pulley (13T Oversized Pulley) -->
      <circle cx="140" cy="235" r="18" fill="#1f242d" stroke="#6b7280" stroke-width="2"/>
      <circle cx="140" cy="235" r="5" fill="url(#metalChrome)"/>

      <!-- Chrome Brand Accent Line -->
      <path d="M75 90 L125 105" stroke="#9ca3af" stroke-width="2"/>
      <text x="100" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="900" letter-spacing="2" fill="#ffffff" text-anchor="middle">
        DI2 12S
      </text>
    </g>

    <!-- Hydraulic Disc Brake Caliper (Right) -->
    <g transform="translate(530, 260)">
      <rect x="0" y="20" width="85" height="110" rx="14" fill="url(#anodizedBlack)"/>
      <!-- Cooling Fins on Brake Pads -->
      <rect x="15" y="10" width="4" height="20" fill="#9ca3af" rx="1"/>
      <rect x="23" y="10" width="4" height="20" fill="#9ca3af" rx="1"/>
      <rect x="31" y="10" width="4" height="20" fill="#9ca3af" rx="1"/>
      <rect x="39" y="10" width="4" height="20" fill="#9ca3af" rx="1"/>
      <rect x="47" y="10" width="4" height="20" fill="#9ca3af" rx="1"/>
      <!-- Bleed Port & Hydraulic Banjo Bolt -->
      <circle cx="65" cy="35" r="6" fill="url(#metalChrome)"/>
      <circle cx="65" cy="115" r="6" fill="url(#metalChrome)"/>
      <!-- Ceramic Dual Piston Chamber -->
      <circle cx="42" cy="75" r="20" fill="#14171c" stroke="#374151" stroke-width="2"/>
      <circle cx="42" cy="75" r="14" fill="#ffffff" opacity="0.85"/>
      <text x="42" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6.5" font-weight="800" letter-spacing="1.5" fill="#9ca3af" text-anchor="middle">
        HYDRAULIC DISC
      </text>
    </g>
  </g>
</svg>
